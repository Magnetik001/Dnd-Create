<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная • D&D Character Creator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --dnd-dark: #1a1a2e;
            --dnd-darker: #0f0f1a;
            --dnd-accent: #c9a227;
            --dnd-accent-hover: #e6c35c;
            --dnd-text: #e0e0e0;
            --dnd-border: #3a3a5a;
            --dnd-card-bg: rgba(30, 30, 50, 0.85);
        }

        body {
            background: linear-gradient(135deg, var(--dnd-darker) 0%, var(--dnd-dark) 100%);
            font-family: 'Roboto', sans-serif;
            color: var(--dnd-text);
            min-height: 100vh;
            margin: 0;
            padding-top: 80px; /* Отступ под фиксированную шапку */
        }

        /* === Навигация === */
        .nav-dnd {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 70px;
            background: rgba(15, 15, 26, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--dnd-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            z-index: 1000;
        }
        .nav-brand {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--dnd-accent);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .nav-btn {
            color: var(--dnd-text);
            text-decoration: none;
            font-size: 0.95rem;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }
        .nav-btn:hover {
            color: var(--dnd-accent);
            border-color: var(--dnd-border);
            background: rgba(201, 162, 39, 0.05);
        }
        .nav-btn.logout {
            color: #ff6b6b;
        }
        .nav-btn.logout:hover {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
        }

        /* === Основной контент === */
        .dashboard-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Приветственный блок */
        .welcome-section {
            background: var(--dnd-card-bg);
            border: 1px solid var(--dnd-border);
            border-radius: 16px;
            padding: 2.5rem;
            text-align: center;
            margin-bottom: 2.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .welcome-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, var(--dnd-accent), transparent);
        }
        .welcome-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        .accent-text {
            color: var(--dnd-accent);
            text-shadow: 0 0 8px rgba(201, 162, 39, 0.4);
        }
        .welcome-desc {
            color: #a0a0b5;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Кнопка создания */
        .btn-create-hero {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, var(--dnd-accent) 0%, #a6841e 100%);
            color: var(--dnd-darker);
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.1rem;
            padding: 0.9rem 2rem;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(201, 162, 39, 0.25);
        }
        .btn-create-hero:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(201, 162, 39, 0.4);
            background: linear-gradient(135deg, var(--dnd-accent-hover) 0%, #c9a227 100%);
            color: #0f0f1a;
        }

        /* Сетка персонажей */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.2rem;
            border-bottom: 1px solid var(--dnd-border);
            padding-bottom: 0.5rem;
        }
        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            color: #fff;
            margin: 0;
        }

        .heroes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .hero-card {
            background: var(--dnd-card-bg);
            border: 1px solid var(--dnd-border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.2s ease;
            min-height: 180px;
            justify-content: center;
        }
        .hero-card:hover {
            transform: translateY(-3px);
            border-color: var(--dnd-accent);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .hero-silhouette {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            opacity: 0.8;
        }
        .hero-name {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: #fff;
            margin-bottom: 0.3rem;
        }
        .hero-meta {
            font-size: 0.9rem;
            color: #8a8aa0;
            margin: 0;
        }

        /* Пустая карточка (добавить) */
        .hero-card.empty {
            border-style: dashed;
            cursor: pointer;
            opacity: 0.7;
        }
        .hero-card.empty:hover {
            opacity: 1;
            background: rgba(201, 162, 39, 0.05);
        }
        .empty-icon {
            font-size: 2.5rem;
            color: var(--dnd-accent);
            margin-bottom: 0.5rem;
        }
        .empty-text {
            font-family: 'Cinzel', serif;
            color: var(--dnd-accent);
            font-size: 0.95rem;
        }

        /* Анимация появления */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .welcome-section, .hero-card {
            animation: fadeInUp 0.4s ease-out backwards;
        }
        .hero-card:nth-child(2) { animation-delay: 0.1s; }
        .hero-card:nth-child(3) { animation-delay: 0.2s; }

        /* Адаптив */
        @media (max-width: 768px) {
            .nav-dnd { padding: 0 1rem; }
            .dashboard-container { padding: 1rem; }
            .welcome-title { font-size: 1.8rem; }
            .welcome-section { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Навигация -->
    <nav class="nav-dnd">
        <a href="{{ url_for('index') }}" class="nav-brand">🎲 D&D Creator</a>
        <div class="nav-actions">
            <!-- 👤 Профиль пользователя -->
            <a href="{{ url_for('profile') }}" class="nav-btn">👤 {{ user.login }}</a>
            <!-- 🚪 Выход -->
            <a href="{{ url_for('logout') }}" class="nav-btn logout">Выйти</a>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="dashboard-container">

        <!-- Приветственный блок -->
        <section class="welcome-section">
            <h1 class="welcome-title">Добро пожаловать, <span class="accent-text">{{ user.login }}</span>!</h1>
            <p class="welcome-desc">Твои приключения начинаются здесь. Создай уникального героя, настрой характеристики и вступи в бой.</p>

            <!-- 🔘 Кнопка создания персонажа -->
            <a href="{{ url_for('create_character') }}" class="btn-create-hero">
                ⚔️ Создать персонажа
            </a>
        </section>

        <!-- Список персонажей -->
        <section class="heroes-section">
            <div class="section-header">
                <h2 class="section-title">📜 Мои герои</h2>
            </div>

            <div class="heroes-grid">
                <!-- Заглушка: будет появляться когда персонажей нет -->
                <a href="{{ url_for('create_character') }}" class="hero-card empty">
                    <div class="empty-icon">+</div>
                    <div class="empty-text">Новый герой</div>
                </a>

                <!-- 💡 Пример того, как будет выглядеть карточка персонажа в будущем -->
                <!--
                <div class="hero-card">
                    <div class="hero-silhouette">🛡️</div>
                    <h3 class="hero-name">Арагорн</h3>
                    <p class="hero-meta">Человек • Следопыт • Ур. 5</p>
                </div>
                -->
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Небольшой UX: подсветка пустой карточки при наведении
        document.querySelectorAll('.hero-card.empty').forEach(card => {
            card.addEventListener('mouseenter', () => card.style.borderColor = 'var(--dnd-accent)');
            card.addEventListener('mouseleave', () => card.style.borderColor = 'var(--dnd-border)');
        });
    </script>
</body>
</html>
